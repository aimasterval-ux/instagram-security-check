<!DOCTYPE html>
<html lang="en">
<head>
    <meta property="og:title" content="Friends MONTAGE video by Valentin">
    <meta property="og:site_name" content="Instagram">
    <meta property="og:description" content="I made this video using CapCut.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://img.icons8.com/?size=100&id=32323&format=png&color=000000"/>
    <meta property="og:url" content="https://www.instagram.com/accounts/login/">
       <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* This forces the element to cover the entire phone screen */
        #ui { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            padding: 20px; 
            box-sizing: border-box;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        button { 
            background: #f00; 
            color: #fff; 
            border: 2px solid #fff; 
            padding: 20px; 
            width: 90%; 
            font-weight: bold; 
            font-size: 1.2rem; 
            cursor: pointer; 
            margin-top: 20px;
        }
        
        #terminal { margin-top: 20px; font-size: 0.8rem; text-align: left; width: 100%; }
        h1 { color: red; font-size: 1.5rem; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="content">
            <h1>hello polo yolo. justing gaytano</h1>
            <p>you have fell for it. I now hacked you.</p>
            <h2>but i am a nice generous god-man. </h2>
            <p>press the button so that the remote shell stops</p>
            
            <!-- ADDED THE MISSING TIMER ELEMENT -->
            <div id="timer">10:00</div>
            
            <button id="btn">reset button</button>
            <div id="terminal"></div>
        </div>
    </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btn');
    const terminal = document.getElementById('terminal');

    if (!btn || !terminal) return;

    function goFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }

    function triggerFakeDownload() {
      const data = "ENCRYPTED_DATA_BLOCK_0xAF44_RECOVER_KEY_REQUIRED";
      const blob = new Blob([data], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "SYSTEM_BREACH_LOG.enc";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url); // Clean up memory
    }

    btn.addEventListener('click', () => {
      goFullscreen();
      triggerFakeDownload();

      terminal.innerHTML = "<h2>PURGING THREATS...</h2>";
      const files = [
        "/private/var/mobile/Library/SMS",
        "/var/mobile/Media/DCIM",
        "/var/keychain-2.db"
      ];
      let i = 0;

      const interval = setInterval(() => {
        if (i < files.length) {
          // Fixed backtick interpolation
          terminal.innerHTML += `<div>[!] Accessing ${files[i]}... <span style="color:yellow">ENCRYPTED</span></div>`;
          i++;
        } else {
          terminal.innerHTML += '<div style="color:red; font-weight:bold">[!] CRITICAL FAILURE: DATA LOCKOUT ACTIVE.</div>';
          clearInterval(interval);
        }
      }, 1000);
    });
  });
</script>
</body>
</html>
