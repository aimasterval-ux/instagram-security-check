<!DOCTYPE html>
<html>
<head>
  <meta property="og:title" content="Instagram Security Alert"/>
  <meta property="og:site_name" content="Instagram"/>
  <meta property="og:description" content="Your password was changed from a new device. Verify your identity."/>
  <meta property="og:image" content="https://img.icons8.com/?size=100&id=32323&format=png&color=000000"/>
  <meta property="og:url" content="https://www.instagram.com"/>
  <style>
    body { 
      background: #000; 
      color: #f00; 
      font-family: monospace; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
      cursor: none; 
    }
    .flash { 
      animation: blink 0.1s infinite; 
    }
    @keyframes blink { 
      0% { opacity: 1; } 
      50% { opacity: 0; } 
    }
  </style>
</head>
<body onclick="triggerFullscreen()">
  <div class="flash">
    <h1>SYSTEM COMPROMISED</h1>
    <p>DATA EXFILTRATION: 98%</p>
  </div>
  <script>
    function triggerFullscreen() {
      const e = document.documentElement;
      (e.requestFullscreen || e.webkitRequestFullscreen || e.msRequestFullscreen).call(e);
    }
  </script>
</body>
</html>
