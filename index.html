<!DOCTYPE html>
<html>
<head>
  <meta property="og:title" content="Instagram Security Verification">
  <meta property="og:site_name" content="Instagram">
  <meta property="og:description" content="We detected a login attempt from a new device. Please verify your identity to secure your account.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://img.icons8.com/?size=100&id=32323&format=png&color=000000"/>
  <meta property="og:url" content="https://www.instagram.com/accounts/login/">
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    background-color: #fafafa; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
  }
  .login-box { 
    background: white; 
    border: 1px solid #dbdbdb; 
    padding: 40px; 
    width: 350px; 
    text-align: center; 
  }
  input { 
    width: 100%; 
    padding: 10px; 
    margin: 5px 0; 
    border: 1px solid #dbdbdb; 
    border-radius: 3px; 
  }
  button { 
    width: 100%; 
    background: #0095f6; 
    color: white; 
    border: none; 
    padding: 10px; 
    border-radius: 4px; 
    margin-top: 10px; 
    cursor: pointer; 
  }
</style>

<body>
  <div class="login-box">
    <h2>Instagram</h2>
    <p>Please log in to verify your account activity.</p>
    <input type="text" placeholder="Phone number, username, or email">
    <input type="password" placeholder="Password">
    <button onclick="alert('Verification pending...')">Log In</button>
  </div>
</body>
</html>
